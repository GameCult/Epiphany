[package]
name = "epiphany-pipeline"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false
license-file = "../LICENSE"

[lib]
name = "epiphany_pipeline"
path = "src/lib.rs"

# A leaf type library. Every dependency here is one the document types need in
# a non-test build; the write path's crates are dev-dependencies, because the
# path itself is `cfg(test)` until the organ owns admission.
[dependencies]
chrono = "0.4.44"
cultcache-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "a0813c6eed24d30bf88073ef615b633c77ebfcd6", package = "cultcache-rs" }
schemars = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
anyhow = "1"
rmp-serde = "1"
serde_json = "1"
