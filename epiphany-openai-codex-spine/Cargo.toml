[package]
name = "epiphany-openai-codex-spine"
version = "0.1.0"
edition = "2024"
publish = false
license-file = "../LICENSE"

[lib]
name = "epiphany_openai_codex_spine"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
codex-client = { path = "../vendor/codex/codex-rs/codex-client" }
epiphany-openai-adapter = { path = "../epiphany-openai-adapter" }
epiphany-openai-auth-spine = { path = "../epiphany-openai-auth-spine" }
futures = "0.3"
http = "1"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "epiphany-openai-spine"
path = "src/bin/epiphany-openai-spine.rs"
