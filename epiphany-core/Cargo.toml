[package]
name = "epiphany-core"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false
license-file = "../LICENSE"

[lib]
name = "epiphany_core"
path = "src/lib.rs"

[features]
public-source-gate-probe = []
semantic-recovery-smoke = []
workspace-coverage-recovery-smoke = []

[[bin]]
name = "epiphany-semantic-recovery-smoke"
path = "src/bin/epiphany-semantic-recovery-smoke.rs"
required-features = ["semantic-recovery-smoke"]

[[bin]]
name = "epiphany-workspace-coverage-recovery-smoke"
path = "src/bin/epiphany-workspace-coverage-recovery-smoke.rs"
required-features = ["workspace-coverage-recovery-smoke"]

[[bin]]
name = "epiphany-agent-memory-store"
path = "src/bin/epiphany-agent-memory-store.rs"

[[bin]]
name = "epiphany-agent-telemetry"
path = "src/bin/epiphany-agent-telemetry.rs"

[[bin]]
name = "epiphany-character-loop"
path = "src/bin/epiphany-character-loop.rs"

[[bin]]
name = "epiphany-cluster-daemon"
path = "src/bin/epiphany-cluster-daemon.rs"

[[bin]]
name = "epiphany-cultmesh-smoke"
path = "src/bin/epiphany-cultmesh-smoke.rs"

[[bin]]
name = "epiphany-daemon-survival-rehearsal-smoke"
path = "src/bin/epiphany-daemon-survival-rehearsal-smoke.rs"

[[bin]]
name = "epiphany-hands-action-smoke"
path = "src/bin/epiphany-hands-action-smoke.rs"

[[bin]]
name = "epiphany-mvp-coordinator-smoke"
path = "src/bin/epiphany-mvp-coordinator-smoke.rs"

[[bin]]
name = "epiphany-operator-run"
path = "src/bin/epiphany-operator-run.rs"

[[bin]]
name = "epiphany-operator-snapshot"
path = "src/bin/epiphany-operator-snapshot.rs"

[[bin]]
name = "epiphany-persona-discord"
path = "src/bin/epiphany-persona-discord.rs"

[[bin]]
name = "epiphany-persona-discord-crossing-fixture"
path = "src/bin/epiphany-persona-discord-crossing-fixture.rs"

[[bin]]
name = "epiphany-persona-discord-rudp-client-fixture"
path = "src/bin/epiphany-persona-discord-rudp-client-fixture.rs"

[[bin]]
name = "epiphany-persona-feedback-causal-smoke"
path = "src/bin/epiphany-persona-feedback-causal-smoke.rs"

[[bin]]
name = "epiphany-persona-memory-recall-smoke"
path = "src/bin/epiphany-persona-memory-recall-smoke.rs"

[[bin]]
name = "epiphany-public-source-gate-probe"
path = "src/bin/epiphany-public-source-gate-probe.rs"
required-features = ["public-source-gate-probe"]

[[bin]]
name = "epiphany-persona-other"
path = "src/bin/epiphany-persona-other.rs"

[[bin]]
name = "epiphany-persona-reddit"
path = "src/bin/epiphany-persona-reddit.rs"

[[bin]]
name = "epiphany-prepare-compaction"
path = "src/bin/epiphany-prepare-compaction.rs"

[[bin]]
name = "epiphany-rider-bridge"
path = "src/bin/epiphany-rider-bridge.rs"

[[bin]]
name = "epiphany-rider-bridge-smoke"
path = "src/bin/epiphany-rider-bridge-smoke.rs"

[[bin]]
name = "epiphany-runtime-store-benchmark"
path = "src/bin/epiphany-runtime-store-benchmark.rs"

[[bin]]
name = "epiphany-state-ledger-store"
path = "src/bin/epiphany-state-ledger-store.rs"

[[bin]]
name = "epiphany-unity-bridge"
path = "src/bin/epiphany-unity-bridge.rs"

[[bin]]
name = "epiphany-unity-bridge-smoke"
path = "src/bin/epiphany-unity-bridge-smoke.rs"

[[bin]]
name = "epiphany-void-memory"
path = "src/bin/epiphany-void-memory.rs"

[[bin]]
name = "epiphany-weksa-interlingua-smoke"
path = "src/bin/epiphany-weksa-interlingua-smoke.rs"

[[bin]]
name = "epiphany-work"
path = "src/bin/epiphany-work.rs"

[dependencies]
anyhow = "1"
bm25 = "2.3.2"
chrono = "0.4.44"
ctrlc = { version = "3.5.1", features = ["termination"] }
cultcache-rs = { path = "../vendor/cultcache-rs" }
cultmesh-rs = { path = "../vendor/cultmesh-rs" }
cultnet-rs = { path = "../vendor/cultnet-rs" }
epiphany-openai-adapter = { path = "../epiphany-openai-adapter" }
epiphany-release-construction = { path = "../epiphany-release-construction" }
epiphany-model-adapter = { path = "../epiphany-model-adapter" }
epiphany-tool-adapter = { path = "../epiphany-tool-adapter" }
epiphany-state-model = { path = "../epiphany-state-model" }
ghostlight-persona-projection = { git = "https://github.com/GameCult/Ghostlight.git", rev = "22281891cbf9258db80c15a9fd465e6fa251e7dd", package = "ghostlight-persona-projection" }
ed25519-dalek = "2"
fs2 = "0.4"
ignore = "0.4.23"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
postgres = "0.19"
reqwest = { version = "0.12", features = ["blocking", "json"] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
sha1 = "0.10.6"
sha2 = "0.10"
toml = "0.9"
tracing = "0.1.44"
uuid = { version = "1", features = ["serde", "v4", "v5"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
wiremock = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
