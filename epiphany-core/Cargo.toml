[package]
name = "epiphany-core"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false
license-file = "../LICENSE"

[lib]
name = "epiphany_core"
path = "src/lib.rs"

[features]
semantic-recovery-smoke = []
workspace-coverage-recovery-smoke = []

[[bin]]
name = "epiphany-semantic-recovery-smoke"
path = "src/bin/epiphany-semantic-recovery-smoke.rs"
required-features = ["semantic-recovery-smoke"]

[[bin]]
name = "epiphany-workspace-coverage-recovery-smoke"
path = "src/bin/epiphany-workspace-coverage-recovery-smoke.rs"
