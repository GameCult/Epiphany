experiment:
  name: Epiphany
  body: F:\Projects\Epiphany
  purpose: Native, inspectable agent organism with typed state and explicit organ authority.

objective:
  current: Restore a trustworthy braked Yggdrasil deployment, then prove one bounded Persona conversation through the governed Bifrost crossing.

architecture:
  body: Repository, runtime, service processes, stores, interfaces, and deployment substrate.
  mind: CultCache-backed typed state admitted through Mind-owned transactions.
  self: Routes pressure and work; does not inherit another organ's authority.
  eyes: Establishes source and observation provenance before change.
  modeling: Maintains the source-grounded RepoModel and Body map.
  imagination: Proposes futures without adopting or executing them.
  hands: Changes the Body only through an admitted action route and scoped gate.
  soul: Verifies consequences and invariants at the layer where failure appears.
  persona: Owns public cognition and speech eligibility.
  continuity: Owns recovery, compaction, sleep, and restart protocol.
  substrate_gate: Owns access grants, not state admission.
  crossings:
    bifrost: Owns governed external transport and its signed receipts.
    idunn: Owns deployment observation and actuation.
    cultmesh: Projects typed state without becoming its owner.
    codex: Retained only for OpenAI-compatible authentication and model transport.

invariants:
  - Mind is the sole durable state-admission authority.
  - Modeling maps the Body; Eyes establishes provenance; Hands acts; Soul verifies; Self routes.
  - Persona speech and external consequences require explicit typed authority and signed receipts.
  - Bifrost owns external transport; Idunn owns deployment actuation; neither may impersonate Epiphany cognition.
  - CultMesh and Eve are projections, never owners of project truth.
  - The canonical swarm brake blocks cognition and consequences while preserving read-only physiology and operator sight.
  - Evidence and git retain history; this map retains only state that changes future decisions.

current_status:
  summary: Epiphany is a native Rust/CultCache/CultMesh/CultNet organism. The local branch is clean and synchronized. Idunn and Bifrost are active on Yggdrasil; Epiphany services are inactive after a clean rollback; the canonical deployment brake is engaged. One deployment request is awaiting authorization, but its grant was not consumed by the current Idunn incarnation. No further deployment or cognition release is authorized until that ownership chain is understood.
  operational_state:
    local_worktree: clean
    deployment_brake: engaged
    idunn: active
    bifrost: active
    epiphany_services: inactive_after_clean_rollback
    pending_deployment_request: awaiting_authorization
  unresolved_authority: Determine why the stable pending deployment request was not matched and consumed by the current Idunn request/owner ledger.
  next_action: Inspect the Idunn request, owner, grant, and incarnation ledger as read-only state; identify the exact broken authority transition before issuing any grant or release.

active_subgoals:
  - Diagnose the pending Idunn request/owner/grant chain without mutation.
  - Refresh this map and the handoff immediately when live evidence changes the operational state.

forbidden_actions:
  - Do not issue a speculative deployment grant.
  - Do not broadly Wake the swarm.
  - Do not reboot Yggdrasil as part of diagnosis.
  - Do not treat stored status, process liveness, or an old receipt as current authority.

memory_policy:
  canonical_map: state/map.yaml
  live_handoff: notes/fresh-workspace-handoff.md
  durable_evidence: state/ledgers.msgpack
  historical_provenance: Git history and archived notes
  rule: If a fact does not constrain a current decision or explain a live invariant, it does not belong in the active Mind.
