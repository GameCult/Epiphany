  operational_state:
    local_worktree: clean_at_ecfff489_live_v42_checkpoint_authority_shakedown
    operator_wireguard: restored
    yggdrasil: canonical_small_public_crossing_body
    starfire: temporary_epiphany_cognition_body
    starfire_runtime_identity: epiphany-starfire
    starfire_swarm_brake: released
    starfire_release: authenticated_ecfff489_modeling_tool_and_output_authority
    starfire_repository_body: bound_and_observed
    starfire_verse_topology: bound_to_current_repository_body
